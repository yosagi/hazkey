name: Build .deb packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (e.g. 0.2.1). Empty = commit time (UTC) + sha auto version"
        required: false
        type: string
      release:
        description: "Also publish the debs as a pre-release (tag yosagi-<version without +g...>)"
        required: false
        type: boolean
        default: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Decide version
        id: ver
        run: |
          VER="${{ inputs.version }}"
          if [ -z "${VER}" ]; then
            # Commit time (UTC) keeps same-day builds ordered; date+sha alone
            # made dpkg compare the SHA's digits and treat newer builds as downgrades
            VER="$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y%m%d.%H%M%S)+g$(git rev-parse --short HEAD)"
          fi
          # '+' is awkward in URLs, and the tag already points at the commit
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=yosagi-${VER%%+*}" >> "$GITHUB_OUTPUT"

  build-deb:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            codename: jammy
            swift_ver: 6.2-RELEASE
            swift_url: https://download.swift.org/swift-6.2-release/ubuntu2204/swift-6.2-RELEASE/swift-6.2-RELEASE-ubuntu22.04.tar.gz
          - runner: ubuntu-24.04
            codename: noble
            swift_ver: 6.2-RELEASE
            swift_url: https://download.swift.org/swift-6.2-release/ubuntu2404/swift-6.2-RELEASE/swift-6.2-RELEASE-ubuntu24.04.tar.gz
          - runner: ubuntu-26.04
            codename: resolute
            # Swift 6.4.0 is the first release with an ubuntu26.04 toolchain.
            # Older (24.04) toolchains fail on 26.04: swift-build needs libxml2.so.2
            swift_ver: 6.4.0-RELEASE
            swift_url: https://download.swift.org/swift-6.4.0-release/ubuntu2604/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE-ubuntu26.04.tar.gz

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache Swift
        id: cache-swift
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/swift
          key: ${{ matrix.runner }}-swift-${{ matrix.swift_ver }}

      - name: Install Swift
        if: steps.cache-swift.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ github.workspace }}/swift
          wget -q ${{ matrix.swift_url }}
          tar xf $(basename ${{ matrix.swift_url }}) --strip-components=1 -C ${{ github.workspace }}/swift

      - name: Add Swift to PATH
        run: echo "${{ github.workspace }}/swift/usr/bin" >> $GITHUB_PATH

      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.1.x"

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            wget gnupg2 build-essential gettext fakeroot dpkg-dev \
            libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev \
            libibus-1.0-dev \
            ninja-build protobuf-compiler libprotoc-dev \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools \
            libqt6widgets6 libqt6gui6 qt6-l10n-tools \
            libglx-dev libgl1-mesa-dev libxkbcommon-dev

      - name: Install Vulkan dependencies (Ubuntu 22.04)
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update -y
          sudo apt-get install -y mesa-vulkan-drivers vulkan-sdk

      - name: Install Vulkan dependencies (Ubuntu 24.04+)
        if: matrix.runner != 'ubuntu-22.04'
        run: sudo apt-get install -y libvulkan-dev glslc

      - name: Build hazkey-settings
        run: |
          mkdir -p hazkey-settings/build && cd hazkey-settings/build
          sed -i "s/Qt::Orientation::/Qt::/g" ../mainwindow.ui
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -G Ninja ..
          ninja -j$(nproc)
          DESTDIR=${{ github.workspace }}/stage/hazkey-server ninja install

      - name: Build fcitx5-hazkey
        run: |
          mkdir -p fcitx5-hazkey/build && cd fcitx5-hazkey/build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -G Ninja ..
          ninja -j$(nproc)
          DESTDIR=${{ github.workspace }}/stage/fcitx5-hazkey ninja install

      - name: Build ibus-hazkey
        run: |
          mkdir -p ibus-hazkey/build && cd ibus-hazkey/build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -G Ninja ..
          ninja -j$(nproc)
          DESTDIR=${{ github.workspace }}/stage/ibus-hazkey ninja install

      - name: Build emacs-hazkey
        run: |
          mkdir -p emacs-hazkey/build && cd emacs-hazkey/build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -G Ninja ..
          ninja -j$(nproc)
          DESTDIR=${{ github.workspace }}/stage/emacs-hazkey ninja install

      - name: Build hazkey-server
        run: |
          mkdir -p hazkey-server/build && cd hazkey-server/build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DGGML_VULKAN=ON -DHAZKEY_SERVER_SWIFT_LTO_MODE=full -G Ninja ..
          ninja -j$(nproc)
          DESTDIR=${{ github.workspace }}/stage/hazkey-server ninja install

      - name: Build .deb packages
        env:
          DEB_MAINTAINER: "yosagi <yoshida@furo.org>"
        run: |
          junktools/make-debs.sh ${{ github.workspace }}/stage ${{ github.workspace }}/debs \
            "${{ needs.version.outputs.ver }}" "${{ matrix.codename }}" \
            hazkey-server/build/swift-build/checkouts

      - name: Upload .deb
        uses: actions/upload-artifact@v6
        with:
          name: hazkey_${{ matrix.codename }}_amd64
          path: debs/*.deb

  release:
    if: inputs.release
    needs: [version, build-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: hazkey_*_amd64
          path: debs
          merge-multiple: true

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VER: ${{ needs.version.outputs.ver }}
        run: |
          cat > notes.md <<EOF
          yosagi が自分の PC に入れるための非公式ビルドです。上流の公式な配布物は [7ka-Hiira/hazkey の Releases](https://github.com/7ka-Hiira/hazkey/releases) にあります。このバイナリの不具合は上流に報告しないでください。

          - パッケージの版: \`${VER}\`
          - コミット: ${GITHUB_SHA}（\`${GITHUB_REF_NAME}\`）
          - deb は Ubuntu の codename ごと（jammy / noble / resolute）。\`hazkey-server\` は必須で、クライアント（\`fcitx5-hazkey\` / \`ibus-hazkey\` / \`emacs-hazkey\`）は同じ版の \`hazkey-server\` に依存します
          EOF
          gh release create "${TAG}" debs/*.deb \
            --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
            --prerelease --title "${TAG}" --notes-file notes.md
